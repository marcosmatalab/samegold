resources:
  jobs:
    samegold_close:
      name: samegold monthly close
      # Trigger.AvailableNow plus a schedule, never an always-on stream: time-based streaming
      # triggers are rejected on serverless compute with INFINITE_STREAMING_TRIGGER_NOT_SUPPORTED,
      # and exceeding the Free Edition quota stops all compute for the rest of the day.
      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: Europe/Madrid
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_and_transform
          pipeline_task:
            pipeline_id: ${resources.pipelines.samegold_pipeline.id}
        - task_key: close_month
          depends_on:
            - task_key: ingest_and_transform
          notebook_task:
            notebook_path: ../src/close_month.py
            base_parameters:
              as_of: "{{job.start_time.iso_datetime}}"
        - task_key: publish_evidence
          depends_on:
            - task_key: close_month
          notebook_task:
            notebook_path: ../src/publish_evidence.py
      # Five concurrent job tasks per account is the Free Edition ceiling; three keeps room.
      email_notifications:
        on_failure: []
