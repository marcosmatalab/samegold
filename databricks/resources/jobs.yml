resources:
  jobs:
    samegold_close:
      name: samegold monthly close
      # Trigger.AvailableNow plus a schedule, never an always-on stream: time-based streaming
      # triggers are rejected on serverless compute with INFINITE_STREAMING_TRIGGER_NOT_SUPPORTED,
      # and exceeding the Free Edition quota stops all compute for the rest of the day.
      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: Europe/Madrid
        # PAUSED, and this is the Free Edition limit talking rather than a preference. An
        # unpaused nightly schedule spends the daily compute quota of a workspace nobody is
        # watching, and the day it overruns, every lane on this account is dead until
        # midnight. The schedule is DECLARED so the shape of the close is in the bundle;
        # `databricks bundle run samegold_close -t free` is how it is actually started.
        pause_status: PAUSED
      # The switch that produces a real failed task, and the only reason it exists is that a
      # repair run cannot be demonstrated without one. It defaults to the empty string, so a
      # failure takes a deliberate `--params fail_task=verify_month:2026-02` at launch, and
      # tests/fast/test_databricks_bundle.py asserts that default and that every notebook task
      # is handed it.
      #
      # The alternative was to break the code and redeploy. `require_fresh_deployment` refuses
      # to run a deployment that is not HEAD, so that means COMMITTING the break - and every
      # record the run produced would then carry the sha of a tree containing a deliberate bug
      # as its provenance. A parameter keeps the deployed code honest.
      parameters:
        - name: fail_task
          default: ""
      # A CEILING ON THE WHOLE RUN, and the thing it protects is the daily compute quota: on
      # Free Edition, overrunning it stops every lane on the account until midnight. This is
      # deliberately not an estimate. The lane's measured work is about two minutes of pipeline
      # plus a handful of short notebook tasks; thirty minutes is roughly ten times that, so it
      # cannot fire on a slow day and does fire on a stuck one.
      #
      # docs/limits.md used to say a job timeout was "deliberately NOT set here because no
      # successful run exists yet to size it from". Successful runs exist now, so the sentence
      # and the omission both go.
      #
      # MEASURED end to end, 5 September 2026: the full job with the false branch is 81 + 51 + 6
      # + 34 seconds of task time plus a condition that costs 0, so under four minutes of work
      # and about six with the gaps between tasks. 1800 is roughly 5x that, and it is the number
      # that has to hold for the SLOWEST shape of the job - the true branch runs a for_each
      # whose width is the data's, so a close over twelve months queues twelve iterations behind
      # a concurrency of 1.
      #
      # AND NOT A `health:` RULE, which is the other way to bound a run and was considered and
      # refused. A health rule pairs a threshold with a NOTIFICATION and notifying is all it
      # does; this account has no destination, so it would fire into nothing or into a personal
      # email address in a public repository. A timeout acts. `docs/databricks-run.md` and
      # `EXAM_MAP.md` carry the argument where a reader who never opens this file will find it.
      timeout_seconds: 1800
      # Five concurrent job tasks per account is the Free Edition ceiling. This job now has six
      # tasks plus a for_each body, and it is still a CHAIN: the two branches are mutually
      # exclusive, and the for_each runs its iterations one at a time (see `concurrency` below),
      # so at most one task of this job is ever running. Four below the ceiling, and the number
      # that would move it is the for_each concurrency.
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_and_transform
          # THE TWO RETRY LEVERS, and the comment that used to be here claimed the first one
          # did the second one's job.
          #
          # It said "Declared, not left to a default", and on 5 September 2026 `databricks jobs
          # get` on the deployed job reported max_retries NOT DECLARED on all six tasks while
          # `timeout_seconds` survived as 600 and 900. So the comment asserted exactly what was
          # not happening. Whether the bundle's serializer drops a field whose value equals its
          # default is a HYPOTHESIS and is not settled here; the falsification costs no compute
          # and is written out in docs/limits.md.
          #
          # And it would not have mattered, which is the part worth reading twice. `max_retries`
          # has a documented default of 0 - never retry - so declaring 0 asks for the behaviour
          # that already applies. In run 44869473800771 `verify_no_restatement` still ran TWICE
          # inside the original run: attempt 0 failed in 6s, attempt 1 started 57s later and
          # failed in 12s. The retry this line was supposed to prevent happened with this line
          # present, and it would have happened with the line absent, because the thing that
          # retried it is not this setting.
          #
          # SERVERLESS AUTO-OPTIMIZATION is. It is ON by default, the UI calls it "Enable
          # serverless auto-optimization (may include additional retries)", and the API field is
          # `disable_auto_optimization`. That is the lever, and it is set below. Note that it is
          # a `true` rather than a zero, so it survives the serializer hypothesis either way.
          #
          # Both are declared: `max_retries: 0` says what this lane wants of the job scheduler,
          # `disable_auto_optimization: true` says it to the part that was actually retrying.
          # Neither has been exercised against a workspace yet - the next deploy is what tests
          # them, and `scripts/databricks_run.sh deploy` now reports which declared task
          # settings the deployed job came back with, so nobody has to remember to look.
          #
          # Neither stops the PIPELINE system retrying an UPDATE, which is a third mechanism
          # again: that is `pipelines.numUpdateRetryAttempts` in databricks.yml.
          max_retries: 0
          disable_auto_optimization: true
          # MEASURED, 5 September 2026, run 592180158314216: this task took 81 seconds. The
          # ceiling is 600, which is 7.4x the measurement - the tightest margin in the job, and
          # deliberately so: it is the only task that starts a pipeline update, an update is
          # where a retry loop once cost fourteen minutes of quota, and the previous measured
          # update was 115s. A ceiling under two minutes would kill a healthy run on a slow
          # allocation; ten minutes cannot fire on a slow day and does fire on a stuck one.
          timeout_seconds: 600
          pipeline_task:
            pipeline_id: ${resources.pipelines.samegold_pipeline.id}
        - task_key: close_month
          # Both levers, for the reason written out on ingest_and_transform above.
          max_retries: 0
          disable_auto_optimization: true
          # MEASURED, 5 September 2026, run 592180158314216: 51 seconds, which includes the
          # serverless cold start. 600 is 11.8x that.
          #
          # The margin is deliberate and it is not an estimate of anything. What a timeout can
          # do on this account is end a HANG before it spends the day's compute; what it must
          # never do is kill a healthy run on a cold allocation, and a cold start alone can be
          # one to two minutes. Ten times the measurement is the smallest number that is
          # comfortably clear of the second failure mode, and it is still 8.5 minutes short of
          # the job ceiling.
          timeout_seconds: 600
          depends_on:
            - task_key: ingest_and_transform
          notebook_task:
            notebook_path: ../src/close_month.py
            base_parameters:
              as_of: "{{job.start_time.iso_datetime}}"
              # Passed, not read from `spark.conf`. A pipeline's `configuration:` block is
              # visible to the pipeline's own sources and to nothing else, so this notebook's
              # `spark.conf.get("samegold.catalog", "samegold")` returned the DEFAULT on every
              # run: point the bundle at another catalog and the close would have been written
              # into a catalog named "samegold" that the deploy never created.
              catalog: ${var.catalog}
              fail_task: "{{job.parameters.fail_task}}"

        # ---------------------------------------------------------------- the decision
        #
        # A close either appends a version or decides not to, and the two need DIFFERENT work
        # afterwards - which is the only reason this task exists. `close_month` publishes
        # `versions_written`, and it is read here.
        #
        # The alternative considered and rejected: no condition at all, and let the for_each
        # below iterate an empty list. That runs zero iterations and succeeds, so a close that
        # decided not to restate would produce exactly nothing - and "nothing changed" and
        # "nothing ran" would arrive as the same evidence, which is the failure this whole
        # repository is written against. The false branch is a check, not an absence.
        - task_key: did_the_close_restate
          depends_on:
            - task_key: close_month
          condition_task:
            op: GREATER_THAN
            left: "{{tasks.close_month.values.versions_written}}"
            right: "0"

        # ---------------------------------------------------------------- the true branch
        #
        # One task per restated month, over a list whose length is set by the DATA: the input
        # is the task value `close_month` published, not a list maintained here. Two months
        # today; a close that restates five would run five iterations with nothing edited.
        #
        # WHY NOT ONE TASK WITH A GROUP BY, which is cheaper and was the first design:
        #   * a single task gives one verdict for every month at once, so a failure says "the
        #     close is wrong" without saying which month - and this lane's whole subject is
        #     that a month moves INDEPENDENTLY of its neighbours;
        #   * a failed month can be re-run alone with `jobs repair-run --rerun-tasks`, and
        #     the months that passed are not spent again. On an account with a daily compute
        #     quota that is the difference between repairing and re-running.
        # The cost is one task run per month, which is what makes the concurrency below a
        # decision rather than a default.
        - task_key: verify_each_restated_month
          depends_on:
            - task_key: did_the_close_restate
              outcome: "true"
          for_each_task:
            inputs: "{{tasks.close_month.values.months_written}}"
            # ONE AT A TIME, and the binding constraint is not the five-task account ceiling -
            # it is the daily compute quota. On serverless each iteration is its own
            # allocation, so two in parallel means two cold starts, and a cold start is the
            # expensive part of an iteration that runs one SELECT. Wall clock is not the scarce
            # thing on this account; compute is.
            #
            # This is a CAP and not a count: the input's length is data-driven, so a close over
            # twelve months queues twelve iterations behind this same 1. If the month count
            # ever makes that wait matter, this is the line to change, and the ceiling it must
            # stay under is five.
            concurrency: 1
            task:
              task_key: verify_month
              max_retries: 0
              disable_auto_optimization: true
              # No iteration of this task has run yet - the third close restated one month and
              # the run took the OTHER branch's shape (one iteration, `verify_month` for
              # 2026-01, 5 checks). Its sibling `verify_no_restatement` measured 6s, and this
              # runs the same shape of query, so 600 is the same ceiling for the same reason.
              # It is a ceiling and not a measurement, and this sentence is what says so.
              timeout_seconds: 600
              notebook_task:
                notebook_path: ../src/verify_month.py
                base_parameters:
                  catalog: ${var.catalog}
                  # The iteration's own input. This is the value that makes the cardinality
                  # data-driven, and the notebook checks its shape rather than trusting it.
                  accounting_month: "{{input}}"
                  job_run_id: "{{job.run_id}}"
                  task_run_id: "{{task.run_id}}"
                  fail_task: "{{job.parameters.fail_task}}"

        # ---------------------------------------------------------------- the false branch
        #
        # A close that wrote nothing is claiming that no eligible month has moved. That claim
        # is checkable and nothing checked it, and it is the more dangerous of the two: a wrong
        # restatement leaves a version somebody can compare, a MISSING one leaves nothing.
        #
        # Not a for_each, deliberately, and the contrast is the argument: this claim is an
        # aggregate over every eligible month with one answer, so per-month tasks would give a
        # task per month whose combined verdict is the same boolean - nothing isolated, nothing
        # separately repairable, which is decoration.
        - task_key: verify_no_restatement
          depends_on:
            - task_key: did_the_close_restate
              outcome: "false"
          max_retries: 0
          disable_auto_optimization: true
          # MEASURED, 5 September 2026: 6s on the run that passed (592180158314216), and 6s and
          # 12s on the two attempts of the run that was made to fail (44869473800771). 600 is
          # 50x the fast case, and that is the largest margin in the job on the shortest task -
          # which is the honest shape: a task that does one SELECT has no interesting slow case
          # to size against, only a cold start, so the ceiling is a hang detector and nothing
          # else. Tightening it would buy nothing and would start killing cold allocations.
          timeout_seconds: 600
          notebook_task:
            notebook_path: ../src/verify_no_restatement.py
            base_parameters:
              catalog: ${var.catalog}
              # The close's own eligibility boundary, as a month string. Passing the close
              # INSTANT instead would put a timestamp this task has to parse and interpolate
              # into SQL; the month is compared as a string and has nothing to escape.
              as_of_month: "{{tasks.close_month.values.as_of_month}}"
              job_run_id: "{{job.run_id}}"
              task_run_id: "{{task.run_id}}"
              fail_task: "{{job.parameters.fail_task}}"

        # ---------------------------------------------------------------- the evidence
        - task_key: publish_evidence
          max_retries: 0
          disable_auto_optimization: true
          # MEASURED, 5 September 2026, run 592180158314216: 34 seconds for roughly twenty
          # queries and two files written to a volume. 900 is 26.5x, the loosest margin here,
          # and it stays loose on purpose: this is the task that must produce a record when
          # everything else has gone wrong, so it is the last one that should be killed by a
          # bound. A record that was never written is the only outcome this lane cannot report.
          timeout_seconds: 900
          depends_on:
            - task_key: verify_each_restated_month
            - task_key: verify_no_restatement
          # ALL_DONE, and this is the honest use rather than a way to make a red run look
          # green. Two reasons, and the first is structural:
          #
          #   * one of the two branches above is ALWAYS skipped, because they are the two
          #     outcomes of one condition. Under the default ALL_SUCCESS this task would never
          #     run at all - a skipped dependency is not a successful one.
          #   * a failure upstream must not leave the evidence silent. Today, if `close_month`
          #     fails, no record is written and the run leaves NOTHING behind: the lane whose
          #     entire subject is that a green tick must mean something would have no evidence
          #     for its worst outcome. `_read` already records unreadable sections by name in
          #     `incomplete`, so a record written after a failure says which parts are holes.
          #
          # WHAT IT COSTS, measured rather than assumed. This comment used to say "It does NOT
          # make the run green: the job's own state is failed if a task failed." Run
          # 44869473800771 on 5 September 2026 was made to fail `verify_no_restatement` and
          # finished as SUCCESS_WITH_FAILURES, not FAILED - because the last task in the graph
          # runs whatever happened and succeeds. So the sentence was wrong in the direction
          # that matters: anyone watching this job by its terminal state does not learn that
          # the close failed.
          #
          # The trade is still worth making and it is a trade, not a free win:
          #
          #   * bought: a failure leaves evidence. The record is written, `incomplete` names
          #     the task that owed rows, and the run is diagnosable from a file instead of from
          #     somebody's memory of a red tick.
          #   * paid: the job's terminal state stops being a failure signal. SUCCESS_WITH
          #     FAILURES is not SUCCESS and not FAILED, and a monitor that treats "not FAILED"
          #     as healthy will read this job as healthy while the close is broken.
          #
          # What restores the signal is the record, not the state: `incomplete` non-empty and
          # `missing_checks` non-empty are the two fields that say so, and the fetch prints
          # them. Alerting on the job state is the thing this shape makes unsafe, and
          # docs/limits.md says so where an operator will read it.
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../src/publish_evidence.py
            base_parameters:
              catalog: ${var.catalog}
              # The event log is read through the `event_log(...)` table function, which needs
              # the pipeline's id. Inside a pipeline source that is `spark.conf.get(
              # "pipelines.id")`; this is a NOTEBOOK task, where that key does not exist and
              # the call would have been `event_log('')`. The bundle knows the id, so it says
              # it here.
              pipeline_id: ${resources.pipelines.samegold_pipeline.id}
              out_dir: /Volumes/${var.catalog}/raw/evidence
              # Dynamic value references, resolved by the runtime at launch. If one of them is
              # not a name the runtime knows, it is passed through as its own text rather than
              # rejected - so a literal "{{job.run_id}}" in the published record is how a wrong
              # reference here becomes visible instead of becoming a plausible-looking blank.
              job_run_id: "{{job.run_id}}"
              task_run_id: "{{task.run_id}}"
              # What the close DECIDED, carried into the record. The same pass-through rule is
              # what makes this safe under ALL_DONE: if `close_month` failed, it published no
              # task values, and these arrive as their own literal text - which the notebook
              # recognises and records as unresolved rather than as data.
              close_decision: "{{tasks.close_month.values.decision}}"
              close_months_written: "{{tasks.close_month.values.months_written}}"
              close_versions_written: "{{tasks.close_month.values.versions_written}}"
              # WHAT EACH UPSTREAM TASK DID, which no task value can say.
              #
              # A task value that does not resolve reports a task that never published one -
              # which catches a failed `close_month` and nothing else. When a VERIFICATION
              # fails, the close succeeded, every value above resolves, and the only trace left
              # is a `close_verification` table with no rows for this run. `result_state` is
              # the reference that can say so; `excluded` is what the skipped branch reports,
              # and the notebook records these without ever letting one silence a hole it
              # derived from the branch.
              state_close_month: "{{tasks.close_month.result_state}}"
              state_verify_each_restated_month: "{{tasks.verify_each_restated_month.result_state}}"
              state_verify_no_restatement: "{{tasks.verify_no_restatement.result_state}}"
              # Passed through the deploy rather than written afterwards by whoever fetched
              # the files. This is what lets the record - and the row-level capture the same
              # task writes - name the code that produced them, from inside the run.
              deploy_commit: ${var.deploy_commit}
              deploy_tree_dirty: ${var.deploy_tree_dirty}
              fail_task: "{{job.parameters.fail_task}}"
