# Declarative Automation Bundle (formerly Databricks Asset Bundles).
#
# Deployed from outside the workspace - a GitHub runner, or `make databricks` on a laptop -
# and never from inside it: Free Edition restricts outbound traffic to a small set of trusted
# domains, so a deploy started from a notebook is unreliable. Authentication is a personal
# access token, because Free Edition has no account console and therefore no OAuth
# machine-to-machine service principals.
#
#   export DATABRICKS_HOST=https://<your-workspace>.cloud.databricks.com
#   export DATABRICKS_TOKEN=dapi...
#   make databricks            # validate, deploy, seed the volume, run, fetch the evidence
#
# or by hand, which is what that target does:
#
#   databricks bundle validate -t free
#   databricks bundle deploy   -t free
#   databricks bundle run samegold_close -t free

bundle:
  name: samegold

variables:
  catalog:
    description: Unity Catalog catalog. Free Edition gives you one metastore and no external locations.
    default: samegold
  # The commit this bundle was deployed from, carried INTO the workspace so that what the run
  # publishes can name it.
  #
  # Until now the only place a commit appeared was `evidence/databricks/fetch.json`, written by
  # the laptop after the fact - so the record measured inside the workspace could not say which
  # code produced it, and a capture taken from the tables could not either. A value the fetching
  # machine writes into a workspace-produced file agrees with itself by construction and can be
  # re-stamped onto stale rows by a later fetch; a value that travels with the deploy cannot.
  #
  # `scripts/databricks_run.sh` passes it. Deploying by hand without it leaves "unknown", which
  # is a fact worth publishing rather than a blank to be filled in later.
  deploy_commit:
    description: The git commit scripts/databricks_run.sh deployed from, or "unknown".
    default: unknown
  deploy_tree_dirty:
    description: Whether that tree had uncommitted changes outside evidence/, or "unknown".
    default: unknown
  # THE ONE THING A BUNDLE CANNOT LEARN ON THIS ACCOUNT. A dashboard and an alert both need a
  # SQL warehouse id, and Free Edition gives exactly one 2X-Small that a bundle can neither
  # create nor look up - which is why `databricks/sql/policies.sql` has been declared and never
  # applied since the lane existed.
  #
  # It is resolvable one layer out: `scripts/databricks_run.sh` asks `warehouses list` - the same
  # call the catalog step makes - and passes the answer at deploy time.
  #
  # THE DEFAULT USED TO BE EMPTY, AND THE COMMENT HERE SAID THAT WAS SO `bundle validate` COULD
  # STILL RUN WITH NO WORKSPACE, "WHICH IS WHAT CI DOES". Both halves were wrong.
  #
  #   * `warehouse_id` is REQUIRED on a dashboard, so an empty value does not validate. Measured
  #     on 6 September 2026: `bundle validate` dies with `dashboard warehouse_id is required` at
  #     resources/dashboards.yml, and so does `bundle run` - EVERY command that loads the bundle
  #     fails, not just the one that deploys. The lane was unusable except through `deploy`,
  #     which is the one command that happens to pass the variable;
  #   * CI does not do it. The `databricks` workflow is `workflow_dispatch` only and has **never
  #     been run** - the API reports `total_count: 0` for its entire history - and the
  #     repository has no `DATABRICKS_HOST`/`DATABRICKS_TOKEN` secrets, so a dispatch would fail
  #     at authentication before it parsed anything. The sentence described a behaviour nobody
  #     had ever executed.
  #
  # SO THE DEFAULT IS A PLACEHOLDER, and the shape of it is the point. It is not a plausible
  # warehouse id and it is not meant to work: a real one is 16 hexadecimal characters, and this
  # is thirty uppercase characters with hyphens, so the API rejects it rather than creating a
  # dashboard attached to nothing.
  #
  # The alternative - a plausible-looking fake so that validate goes green - is a check that
  # supplies its own input, which is the defect this repository has found in a fixture, a
  # document and a spark harness already. `validate` says out loud that it ran against a
  # placeholder, and `step_deploy` REFUSES to deploy with it. Both are tested without
  # credentials in tests/fast/test_databricks_catalog_step.py, because this defect exists
  # precisely because nobody ran the path a comment promised.
  warehouse_id:
    description: The SQL warehouse the dashboard and the alert attach to. Defaults to a placeholder that validates and cannot deploy; scripts/databricks_run.sh resolves the real one at deploy time.
    default: PLACEHOLDER-NOT-A-WAREHOUSE-ID

targets:
  free:
    default: true
    # No `mode: development`. Development mode renames every resource it deploys with a
    # per-user prefix, and this lane's whole output is an evidence record that NAMES the
    # tables it read: `samegold.main.revenue_by_month` in the record has to be the table that
    # exists. There is also nobody to be isolated from - Free Edition is one workspace with
    # one user. What development mode is actually wanted for here is the pipeline's
    # no-retry behaviour, and that is a pipeline field, set explicitly below.
    #
    # No `host:` here either. ${var.DATABRICKS_HOST} does not validate: ${var.X} resolves a
    # variable declared in this file's `variables:` block, and DATABRICKS_HOST is an
    # authentication environment variable for the CLI, not a bundle variable. Leaving the
    # host out lets `databricks bundle validate -t free` take it from DATABRICKS_HOST or from
    # the configured profile, which is what the CI job and `make databricks` set.
    resources:
      pipelines:
        samegold_pipeline:
          # `name` is REQUIRED by POST /api/2.0/pipelines, and this key is the bundle's
          # resource id, not the pipeline's name. Without it the first real deploy died with
          # `name must be set (400 INVALID_PARAMETER_VALUE)` - after
          # `databricks bundle validate -t free` had answered `Validation OK!` on this exact
          # file, and after the CI job that runs validate had been green on it for a round.
          # Validate checks syntax, includes and variable resolution, and warns about
          # properties it does not recognise; it does not check that the request it will send
          # is one the API will accept. tests/fast/test_databricks_bundle.py does now.
          name: samegold
          # One active pipeline per pipeline type is the Free Edition limit, so there is
          # exactly one, and it is serverless because that is the only compute available.
          # `photon: true` used to be here; serverless compute is Photon and the flag is not
          # a knob you own there, so it was a claim about the deploy that the deploy does not
          # honour. tests/fast/test_databricks_bundle.py keeps it out.
          serverless: true
          continuous: false
          # WHAT THIS DOES, corrected after measuring it. The comment here used to say "a
          # development pipeline does NOT retry a failed update", and on 2 September 2026 one
          # `bundle run` produced SIX failed updates between 12:17 and 12:31 UTC - five
          # automatic retries, fourteen minutes of Free Edition quota - with
          # `databricks pipelines get` confirming `development: true` on the deployed spec.
          #
          # The reference explains it: retry behaviour follows HOW THE UPDATE WAS TRIGGERED,
          # not this field. An update started from the pipeline UI's Run now is what gets
          # "disables pipeline retries so you can immediately detect and fix errors"; an
          # update triggered through Jobs or the API gets "automatic retry and restart
          # behavior ... in the event of specific errors". This lane is started by
          # `databricks bundle run samegold_close`, which is a JOB, so it takes the second
          # path whatever this field says.
          #
          # It is kept because what it does do is still wanted - development pipelines do not
          # keep compute warm for reuse - but it buys nothing about retries.
          #
          # AND THERE IS A SETTING THAT DOES, which the first version of this comment said
          # there was not. `pipelines.numUpdateRetryAttempts` is a pipeline configuration
          # property, documented as "If a retryable failure occurs during an update, this is
          # the maximum number of times to retry the update before permanently failing the
          # update", with a default of "Five for triggered pipelines. Unlimited for continuous
          # pipelines." Five. The observed run produced six updates from one launch. It is set
          # to 0 below, in the `configuration:` block, which is where the reference says these
          # properties live. `max_retries: 0` on the job tasks is a different lever for a
          # different retry and is kept as well; see resources/jobs.yml.
          development: true
          channel: CURRENT
          catalog: ${var.catalog}
          # Exactly one of `schema` or `target` must be set - the API's words. Setting both,
          # or neither, is rejected at POST time and passes validate.
          schema: main
          configuration:
            # NOT read by the sources: these two are read by the pipeline RUNTIME, and they
            # are the answer to the six-updates-from-one-launch measurement in docs/limits.md.
            #
            #   pipelines.numUpdateRetryAttempts - "the maximum number of times to retry the
            #   update before permanently failing the update", default "Five for triggered
            #   pipelines". Five is exactly what was observed, and this lane is triggered by a
            #   job, which is the path the reference gives automatic retry behaviour to.
            #
            #   pipelines.maxFlowRetryAttempts - the same idea one level down, for a FLOW
            #   inside an update, default two retries (three attempts including the first).
            #   NOT the mechanism that was measured, and set anyway: it is the same hazard
            #   with the same price, and on an account whose quota is a hard daily stop a
            #   failure worth retrying is cheaper to re-run by hand than to retry three times
            #   automatically.
            #
            # Both are strings because a pipeline `configuration` block is a map of strings.
            # Neither has been exercised against a workspace from here; what HAS been measured
            # is the default they are overriding.
            pipelines.numUpdateRetryAttempts: "0"
            pipelines.maxFlowRetryAttempts: "0"
            # Read by the pipeline SOURCES through `spark.conf.get`. This reaches the three
            # files below and nothing else: a `configuration:` entry is pipeline-scoped and
            # is NOT visible to the notebook tasks in resources/jobs.yml, which is why those
            # take their catalog as a job parameter instead. `close_month.py` and
            # `publish_evidence.py` both used to read `spark.conf.get("samegold.catalog")`
            # and would have silently closed the books in a catalog called "samegold" no
            # matter what this variable said.
            samegold.landing: /Volumes/${var.catalog}/raw/landing
          libraries:
            # Paths resolve against the file that declares them, and this file lives at the
            # bundle root, so `../src` pointed OUTSIDE the bundle at a directory that does not
            # exist. It is `src/` from here. (resources/jobs.yml, one directory deeper, is the
            # one that legitimately says `../src`.)
            - file:
                path: src/bronze_autoloader.py
            - file:
                path: src/silver_expectations.py
            - file:
                path: src/gold_close.py

include:
  - resources/*.yml
