<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" role="img" aria-label="bronze_events feeds silver_classified and, separately, silver_events. silver_classified feeds silver_quarantine, revenue_by_month and silver_events_customers, which feeds dim_customer_scd2. The bitemporal close writes one immutable version per close into revenue_closed. The Databricks lane and the DuckDB reference compute it twice and must agree on one canonical digest.">
<defs><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7681"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7b72"/></marker><marker id="a-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d2a8ff"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker></defs>
<rect width="920" height="500" fill="#0d1117"/>
<text x="28" y="30" fill="#e6edf3" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="600">One contract, two implementations, one digest</text>
<text x="28" y="50" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start">Every table named here is one the lane creates, and every arrow is a read the lane actually does.</text>
<rect x="28" y="78" width="148" height="44" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/><text x="102" y="94" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" dominant-baseline="middle">bronze_events</text><text x="102" y="111" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">append-only, raw</text>
<path d="M 176 100 L 212 100" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#a-line)"/>
<rect x="212" y="78" width="158" height="44" rx="6" fill="#121d2f" stroke="#58a6ff" stroke-width="1.5"/><text x="291" y="94" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" dominant-baseline="middle">silver_classified</text><text x="291" y="111" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">every row, with a reason</text>
<path d="M 370 100 L 650 100" stroke="#d2a8ff" stroke-width="1.6" fill="none" marker-end="url(#a-gold)"/>
<rect x="650" y="78" width="168" height="44" rx="6" fill="#1d1728" stroke="#d2a8ff" stroke-width="1.5"/><text x="734" y="94" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" dominant-baseline="middle">revenue_by_month</text><text x="734" y="111" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">gold</text>
<path d="M 176 100 L 194 100 L 194 172 L 212 172" stroke="#3fb950" stroke-width="1.6" fill="none" marker-end="url(#a-good)"/>
<rect x="212" y="150" width="158" height="44" rx="6" fill="#101d16" stroke="#3fb950" stroke-width="1.5"/><text x="291" y="166" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" dominant-baseline="middle">silver_events</text><text x="291" y="183" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">expectations, for the event log</text>
<path d="M 370 100 L 400 100 L 400 172 L 430 172" stroke="#ff7b72" stroke-width="1.6" fill="none" marker-end="url(#a-bad)"/>
<rect x="430" y="150" width="158" height="44" rx="6" fill="#25171c" stroke="#ff7b72" stroke-width="1.5"/><text x="509" y="166" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" dominant-baseline="middle">silver_quarantine</text><text x="509" y="183" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">rejected, with reason</text>
<path d="M 370 100 L 400 100 L 400 244 L 430 244" stroke="#d2a8ff" stroke-width="1.6" fill="none" marker-end="url(#a-gold)"/>
<rect x="430" y="222" width="176" height="44" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/><text x="518" y="238" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" dominant-baseline="middle">silver_events_customers</text><text x="518" y="255" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">temporary view</text>
<path d="M 606 244 L 650 244" stroke="#d2a8ff" stroke-width="1.6" fill="none" marker-end="url(#a-gold)"/>
<rect x="650" y="222" width="168" height="44" rx="6" fill="#1d1728" stroke="#d2a8ff" stroke-width="1.5"/><text x="734" y="238" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" dominant-baseline="middle">dim_customer_scd2</text><text x="734" y="255" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">Type 2, one open row per key</text>
<text x="224" y="212" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">silver_events is a PARALLEL table, not a stage: gold reads silver_classified</text>
<path d="M 818 100 L 866 100 L 866 320 L 790 320" stroke="#d2a8ff" stroke-width="1.6" fill="none" marker-end="url(#a-gold)"/>
<rect x="566" y="300" width="224" height="40" rx="6" fill="#1d1728" stroke="#d2a8ff" stroke-width="1.5"/><text x="678" y="314" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" dominant-baseline="middle">close_month  (bitemporal)</text><text x="678" y="331" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">as-of the close instant</text>
<path d="M 678 340 L 678 366" stroke="#d2a8ff" stroke-width="1.6" fill="none" marker-end="url(#a-gold)"/>
<text x="678" y="382" fill="#e6edf3" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="600">revenue_closed  -  one immutable row per version</text>
<rect x="508" y="394" width="160" height="44" rx="6" fill="#21262d" stroke="#3d444d" stroke-width="1.5"/><text x="588" y="410" fill="#e6edf3" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="middle">v0</text><text x="588" y="427" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">signed off, frozen</text>
<rect x="686" y="394" width="160" height="44" rx="6" fill="#101d16" stroke="#3fb950" stroke-width="1.5"/><text x="766" y="410" fill="#e6edf3" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="middle">v1</text><text x="766" y="427" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">restated, v0 untouched</text>
<text x="678" y="458" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">a late return moves a closed month</text>
<text x="678" y="474" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">without rewriting the version finance approved</text>
<rect x="28" y="300" width="404" height="150" rx="8" fill="none" stroke="#3d444d" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="48" y="322" fill="#e6edf3" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="600">computed twice, independently</text>
<rect x="48" y="336" width="158" height="42" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/><text x="127" y="351" fill="#e6edf3" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="middle">Databricks lane</text><text x="127" y="368" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">SDP + AUTO CDC</text>
<rect x="48" y="390" width="158" height="42" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/><text x="127" y="405" fill="#e6edf3" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="middle">DuckDB reference</text><text x="127" y="422" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">the oracle</text>
<path d="M 206 357 L 252 379" stroke="#58a6ff" stroke-width="1.6" fill="none" marker-end="url(#a-accent)"/>
<path d="M 206 411 L 252 389" stroke="#58a6ff" stroke-width="1.6" fill="none" marker-end="url(#a-accent)"/>
<rect x="252" y="363" width="160" height="42" rx="6" fill="#121d2f" stroke="#58a6ff" stroke-width="1.5"/><text x="332" y="378" fill="#e6edf3" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="middle">canonical digest</text><text x="332" y="395" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">they agree, or the lane is red</text>
</svg>
