<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-label="The samegold pipeline: bronze_events to silver_classified, which splits into silver_events and silver_quarantine; silver_events feeds revenue_by_month and dim_customer_scd2; the bitemporal close_month writes one immutable version per close into revenue_closed. The Databricks lane and the DuckDB reference compute it twice and must agree on one canonical digest.">
<defs><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/></marker><marker id="a-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8250df"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/></marker></defs>
<rect width="920" height="440" fill="#ffffff"/>
<text x="28" y="30" fill="#1f2328" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="600">One contract, two implementations, one digest</text>
<text x="28" y="50" fill="#656d76" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start">Every table named below is created by the lane; the two engines must agree to the cent.</text>
<rect x="28" y="78" width="148" height="44" rx="6" fill="#f6f8fa" stroke="#adb5bd" stroke-width="1.5"/><text x="102.0" y="94.0" fill="#1f2328" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" dominant-baseline="middle">bronze_events</text><text x="102.0" y="111.0" fill="#656d76" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">append-only, raw</text>
<path d="M 176 100 L 212 100" stroke="#8c959f" stroke-width="1.6" fill="none" marker-end="url(#a-line)"/>
<rect x="212" y="78" width="158" height="44" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="291.0" y="94.0" fill="#1f2328" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" dominant-baseline="middle">silver_classified</text><text x="291.0" y="111.0" fill="#656d76" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">every row, with a reason</text>
<path d="M 370 100 L 428 100" stroke="#1a7f37" stroke-width="1.6" fill="none" marker-end="url(#a-good)"/>
<rect x="428" y="78" width="148" height="44" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="502.0" y="94.0" fill="#1f2328" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" dominant-baseline="middle">silver_events</text><text x="502.0" y="111.0" fill="#656d76" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">accepted</text>
<path d="M 370 100 L 399.0 100 L 399.0 182 L 428 182" stroke="#cf222e" stroke-width="1.6" fill="none" marker-end="url(#a-bad)"/>
<rect x="428" y="160" width="148" height="44" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="502.0" y="176.0" fill="#1f2328" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" dominant-baseline="middle">silver_quarantine</text><text x="502.0" y="193.0" fill="#656d76" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">rejected, with reason</text>
<text x="502" y="222" fill="#656d76" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">silver_classified = silver_events + silver_quarantine</text>
<path d="M 576 100 L 622 100" stroke="#8250df" stroke-width="1.6" fill="none" marker-end="url(#a-gold)"/>
<rect x="622" y="78" width="168" height="44" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="706.0" y="94.0" fill="#1f2328" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" dominant-baseline="middle">revenue_by_month</text><text x="706.0" y="111.0" fill="#656d76" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">gold</text>
<path d="M 576 100 L 599.0 100 L 599.0 182 L 622 182" stroke="#8250df" stroke-width="1.6" fill="none" marker-end="url(#a-gold)"/>
<rect x="622" y="160" width="168" height="44" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="706.0" y="176.0" fill="#1f2328" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" dominant-baseline="middle">dim_customer_scd2</text><text x="706.0" y="193.0" fill="#656d76" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">Type 2, one open row per key</text>
<path d="M 706 122 L 706 140 L 848 140 L 848 250 L 790 250" stroke="#8250df" stroke-width="1.6" fill="none" marker-end="url(#a-gold)"/>
<rect x="566" y="232" width="224" height="40" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="678.0" y="246.0" fill="#1f2328" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" dominant-baseline="middle">close_month  (bitemporal)</text><text x="678.0" y="263.0" fill="#656d76" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">as-of the close instant</text>
<path d="M 678 272 L 678 300" stroke="#8250df" stroke-width="1.6" fill="none" marker-end="url(#a-gold)"/>
<text x="678" y="316" fill="#1f2328" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="600">revenue_closed  -  one immutable row per version</text>
<rect x="508" y="328" width="160" height="44" rx="6" fill="#eaeef2" stroke="#adb5bd" stroke-width="1.5"/><text x="588.0" y="344.0" fill="#1f2328" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="middle">v0</text><text x="588.0" y="361.0" fill="#656d76" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">signed off, frozen</text>
<rect x="686" y="328" width="160" height="44" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="766.0" y="344.0" fill="#1f2328" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="middle">v1</text><text x="766.0" y="361.0" fill="#656d76" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">restated, v0 untouched</text>
<text x="678" y="392" fill="#656d76" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">a late return moves a closed month</text>
<text x="678" y="408" fill="#656d76" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">without rewriting the version finance approved</text>
<rect x="28" y="252" width="404" height="156" rx="8" fill="none" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="48" y="276" fill="#1f2328" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="600">computed twice, independently</text>
<rect x="48" y="292" width="158" height="42" rx="6" fill="#f6f8fa" stroke="#adb5bd" stroke-width="1.5"/><text x="127.0" y="307.0" fill="#1f2328" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="middle">Databricks lane</text><text x="127.0" y="324.0" fill="#656d76" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">SDP + AUTO CDC</text>
<rect x="48" y="348" width="158" height="42" rx="6" fill="#f6f8fa" stroke="#adb5bd" stroke-width="1.5"/><text x="127.0" y="363.0" fill="#1f2328" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="middle">DuckDB reference</text><text x="127.0" y="380.0" fill="#656d76" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">the oracle</text>
<path d="M 206 313 L 252 336" stroke="#0969da" stroke-width="1.6" fill="none" marker-end="url(#a-accent)"/>
<path d="M 206 369 L 252 346" stroke="#0969da" stroke-width="1.6" fill="none" marker-end="url(#a-accent)"/>
<rect x="252" y="320" width="160" height="42" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="332.0" y="335.0" fill="#1f2328" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="middle">canonical digest</text><text x="332.0" y="352.0" fill="#656d76" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">they agree, or the lane is red</text>
</svg>
