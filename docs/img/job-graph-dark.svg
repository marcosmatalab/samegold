<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="The samegold monthly close job: ingest_and_transform runs the Lakeflow pipeline, close_month writes the versioned close, did_the_close_restate is a condition on versions_written greater than zero, whose true branch runs verify_each_restated_month once per month and whose false branch runs verify_no_restatement, and publish_evidence runs after either of them and writes the record under evidence/databricks.">
<defs><marker id="jd-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7681"/></marker><marker id="jd-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker><marker id="jd-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922"/></marker></defs>
<rect width="920" height="470" fill="#0d1117"/>
<text x="28" y="30" fill="#e6edf3" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="600">samegold monthly close: six tasks, and the branch is the point</text>
<text x="28" y="50" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start">Declared in databricks/resources/jobs.yml. A close that restated a month verifies each month it restated; a close that restated nothing verifies that too.</text>

<rect x="330" y="72" width="260" height="46" rx="8" fill="#121d2f" stroke="#58a6ff" stroke-width="1.4"/>
<text x="460" y="92" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" font-weight="600">ingest_and_transform</text>
<text x="460" y="109" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">pipeline_task &#183; bronze to silver to gold, with its expectations</text>
<path d="M 460 118 L 460 146" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#jd-line)"/>

<rect x="330" y="150" width="260" height="46" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.4"/>
<text x="460" y="170" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" font-weight="600">close_month</text>
<text x="460" y="187" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">notebook_task &#183; writes one immutable version per close</text>
<path d="M 460 196 L 460 224" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#jd-line)"/>

<rect x="300" y="228" width="320" height="50" rx="8" fill="#272115" stroke="#d29922" stroke-width="1.4"/>
<text x="460" y="248" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" font-weight="600">did_the_close_restate</text>
<text x="460" y="266" fill="#9198a1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">condition_task &#183; versions_written &gt; 0</text>

<path d="M 340 278 L 220 278 L 220 320" stroke="#3fb950" stroke-width="1.6" fill="none" marker-end="url(#jd-good)"/>
<text x="228" y="302" fill="#3fb950" font-family="ui-monospace, monospace" font-size="11" text-anchor="start" font-weight="600">true</text>
<path d="M 580 278 L 700 278 L 700 320" stroke="#d29922" stroke-width="1.6" fill="none" marker-end="url(#jd-bad)"/>
<text x="660" y="302" fill="#d29922" font-family="ui-monospace, monospace" font-size="11" text-anchor="end" font-weight="600">false</text>

<rect x="60" y="324" width="320" height="52" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.4"/>
<text x="220" y="344" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" font-weight="600">verify_each_restated_month</text>
<text x="220" y="361" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">for_each_task &#183; one notebook run per month restated</text>

<rect x="540" y="324" width="320" height="52" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1.4"/>
<text x="700" y="344" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" font-weight="600">verify_no_restatement</text>
<text x="700" y="361" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">notebook_task &#183; nothing moved, and that is checked too</text>

<path d="M 220 376 L 220 410 L 460 410 L 460 424" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#jd-line)"/>
<path d="M 700 376 L 700 410 L 460 410" stroke="#6e7681" stroke-width="1.6" fill="none"/>

<rect x="300" y="428" width="320" height="34" rx="8" fill="#1d1728" stroke="#d2a8ff" stroke-width="1.4"/>
<text x="460" y="450" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle" font-weight="600">publish_evidence</text>
<text x="880" y="450" fill="#9198a1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="end">writes evidence/databricks/</text>
</svg>
