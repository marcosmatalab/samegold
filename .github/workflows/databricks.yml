name: databricks

# Manual only, and narrow on purpose. It deploys to a Free Edition workspace, where a single
# run can exhaust the daily quota and stop all compute for the rest of the day; putting that on
# a push trigger would mean one busy afternoon takes the workspace down.
#
# Deploys from the runner rather than from inside the workspace: Free Edition restricts
# outbound traffic to a small set of trusted domains, and a bundle deploy started from a
# notebook there is unreliable. Authentication is a PERSONAL access token because Free Edition
# has no account console and therefore no service principals and no OAuth machine-to-machine
# credentials. `docs/limits.md` carries what that costs; it is a limitation of the free tier
# and not a design choice, and the honest place to say so is beside the other free-tier limits.
#
# Every step goes through scripts/databricks_run.sh, which is also what `make databricks` runs.
# Two definitions of what this lane does is how they drift, and a lane that behaves differently
# in CI from the way it behaves on a laptop is the thing round 12 was about.
#
# WHAT THIS WORKFLOW WILL NOT DO, and each of these is a decision:
#
#   * it never runs `bundle run`, and there is no input that makes it. A deploy uploads
#     definitions and starts no compute; a run spends the day's quota, and a quota spent from
#     CI is a workspace nobody can use until tomorrow. Starting the job is a thing a person
#     does, at a keyboard, having decided to;
#   * it never seeds, for the same reason: seeding is what makes a run meaningful, and there
#     is no run here;
#   * it takes no `push` and no `schedule` trigger. `workflow_dispatch` only.
#
# THE SECRETS LIVE IN AN ENVIRONMENT, not in repository secrets. `environment: databricks` is
# what grants this job access to them, and no other job in this repository can reach them - a
# repository secret is visible to every workflow, including one added later by a pull request
# that nobody read carefully. The token is a personal one with the whole workspace behind it,
# so the blast radius is worth narrowing twice.
#
# THE ACTIONS ARE PINNED TO COMMIT SHAs, not to tags. A tag is a mutable pointer: whoever can
# move `v4` can run their code in a job that holds a live workspace token, and that is the
# realistic way a secret leaves a repository. This repository already has a name for a mutable
# pointer that looks like a promise - `FINDINGS.md` calls it "a declaration that does not
# govern" - and a floating action tag is exactly that shape. The version each SHA corresponds
# to is written beside it so a reader can check the pin without resolving it.
#
# READ THIS BEFORE TRUSTING A GREEN TICK HERE. `databricks bundle validate` checks syntax,
# `include:` resolution and variable substitution, and warns about properties it does not
# recognise. It does NOT check that the request body it will send is one the API accepts: this
# job was green for a round on a bundle whose first POST came back `name must be set`. The
# required fields are asserted in tests/fast/test_databricks_bundle.py, in the FAST lane, which
# is where a check that needs no credentials belongs.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "validate (no workspace changes) | deploy (definitions only, no compute)"
        type: choice
        options: [validate, deploy]
        default: validate

# The GITHUB_TOKEN needs to read the checkout and nothing else. It cannot write to the
# repository, cannot open a pull request, and cannot publish a package.
permissions:
  contents: read

# ONE AT A TIME, AND THE RUNNING ONE WINS. A workspace is not a build: two deploys against one
# Free Edition workspace interleave their uploads, and the loser of that race leaves the bundle
# half-written with no error anywhere. `cancel-in-progress: false` on purpose - cancelling a
# deploy mid-upload is the one way to get a workspace state that matches no commit, which is
# the "the workspace ran what was deployed, and nobody had deployed" finding in FINDINGS.md
# arriving by a different road.
concurrency:
  group: databricks-workspace
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # NOT IN A FORK. There is no `pull_request` trigger here and
    # tests/fast/test_databricks_bundle.py refuses to let one be added, so this guard is not
    # what stops a fork's pull request reaching the token - the absence of the trigger is. It
    # is here for the case the trigger list does not cover: somebody forks this repository,
    # dispatches the workflow in their copy, and the secret names resolve to whatever they
    # happen to have under those names. A job that is skipped says so in the UI; a job that
    # runs against a workspace the author did not mean to touch says nothing at all.
    if: github.repository == 'marcosmatalab/samegold'
    # The environment is the access control. Without this line the secrets below resolve to
    # empty strings and the CLI fails at authentication, which is the shape of the failure
    # measured on 8 September 2026 when the environment did not yet exist.
    environment: databricks
    steps:
      # actions/checkout v4.1.7
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # databricks/setup-cli v1.14.1, which is the version `evidence/databricks/fetch.json`
      # RECORDS as having produced the committed records. Was `@main` until 8 September 2026 -
      # a moving branch on a third-party action in a job that holds a workspace token - and
      # then v0.221.1, and that pin is the whole of the next paragraph.
      #
      # WHY NOT v0.221.x. The pin taken on 8 September froze CI to a CLI released in APRIL,
      # five months older than the v1.14.1 the laptop was already deploying with, and nothing
      # noticed because CI only ever ran `validate`, which touches no state. The first deploy
      # from CI, run 35756907303, failed with:
      #
      #   Error: cannot create pipeline: The pipeline name 'samegold' is already used by
      #   another pipeline.
      #
      # Measured, in the CLI's own source rather than in the workspace: from v1.x the DIRECT
      # deployment engine is the default, and after a deploy it migrates the Terraform state -
      # "renamed to resources.json, terraform.tfstate is" removed
      # (bundle/statemgmt/direct_migration.go). So the September deploys, made with v1.14.1,
      # left the deployment state in `resources.json`; a v0.221.2 CLI knows only
      # `terraform.tfstate`, found nothing it could read, and planned to CREATE a pipeline
      # that already exists. The collision is a symptom of the version gap, not of the
      # workspace, and the pipeline the records cite is untouched.
      #
      # The key-expiry patch is still satisfied: `bundle/deploy/terraform/pubkey.go`, the file
      # v0.221.2 added to carry HashiCorp's new signing key, is present in v1.14.1 at the same
      # size. tests/fast/test_databricks_cli_pin.py holds this pin against the record.
      - uses: databricks/setup-cli@602f285bac0c85e5985bf4c16d5a2befed0578d9

      - name: validate (no workspace changes)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: scripts/databricks_run.sh validate

      - name: deploy (definitions only, never a run)
        if: inputs.action == 'deploy'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        # `deploy-definitions`, NOT `deploy`, and the difference is the promise this workflow
        # makes. `deploy` is catalog, then validate, then deploy - and the catalog step creates
        # a missing catalog with a SQL statement, because a bundle cannot declare one (there is
        # no `catalogs` resource type, and on Default Storage `databricks catalogs create`
        # fails outright). A SQL statement STARTS the one 2X-Small warehouse Free Edition
        # gives you, so `deploy` may spend compute quota - not because of anything in the
        # bundle, but depending on whether the catalog happens to exist that day.
        #
        # A guarantee that holds only while nobody has deleted a catalog is not a guarantee.
        # `deploy-definitions` asks `databricks catalogs get`, which is a REST call, and
        # REFUSES with the command to run by hand if the catalog is not there. So "this lane
        # never starts compute" is a property of the command rather than of the workspace.
        #
        # Everything the bundle itself declares is inert on deploy, measured rather than
        # assumed: the pipeline is `continuous: false`, the job schedule and the dashboard
        # alert are both `pause_status: PAUSED`, the warehouse is referenced by id and not
        # created, and the target sets no `mode: development`.
        run: scripts/databricks_run.sh deploy-definitions

      - name: what failed, said rather than left to be deduced
        if: failure()
        # No environment dump. The three things worth knowing are named, and none of them is a
        # secret; `env` or `set -x` here would put a live workspace token in a public log.
        run: |
          echo "The deploy did not complete. The three failures this lane actually has, in the"
          echo "order they occur:"
          echo
          echo "  1. AUTHENTICATION. 'cannot configure default credentials' means the"
          echo "     environment 'databricks' has no DATABRICKS_HOST/DATABRICKS_TOKEN, or the"
          echo "     token has expired. Measured 8 September 2026: validate resolves auth AND"
          echo "     calls /api/2.0/preview/scim/v2/Me, so it needs a reachable workspace and"
          echo "     working credentials. A placeholder does not get past this."
          echo
          echo "  2. THE CATALOG. A bundle cannot declare one, so scripts/databricks_run.sh"
          echo "     creates it with SQL before deploying. If the log stops after"
          echo "     '==> catalog', the deploy never started and the bundle is not the"
          echo "     problem: see the catalog row in docs/runbook.md."
          echo
          echo "  3. THE BUNDLE. 'Validation OK!' followed by a 400 on the first POST is the"
          echo "     round-13 finding repeating, and the message names the field."
          echo
          echo "docs/runbook.md is the page for all three."
