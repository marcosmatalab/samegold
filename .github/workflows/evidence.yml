name: evidence

# The only job allowed to write evidence that backs a published number. A record produced
# anywhere else carries no ci_run_url and the renderer prints it as "local run, not reproduced
# in CI", which is the honest label for a number produced on the author's laptop.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write
  id-token: write
  attestations: write
  # `gh pr create` needs this and did not have it. The step that opens the pull request ended
  # in `|| true`, so the job would have finished GREEN having pushed a branch and opened
  # nothing - an hour of compute reporting success for work it had not done, which is the
  # shape this repository keeps finding in itself.
  pull-requests: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      SAMEGOLD_STORAGE: parquet
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[spark,rust,dev]"
      - name: claims
        run: samegold evidence --profile ci
      - name: crash campaign and the claims that need a JVM
        # `--repetitions 10`, which is what `make evidence-full` uses, and NOT the CLI default
        # of 3. SG-07 publishes an upper bound, and the bound is a function of the number of
        # injected runs: the first dispatch of this workflow took the default, produced 6 runs
        # instead of 20, and would have replaced a published bound of 15% with one of 50% while
        # improving the provenance label from "local run" to "CI". A number that gets worse
        # because the job that produced it was cheaper is not a better number for having a
        # runner's name on it. tests/fast/test_preflight.py holds the two in step.
        run: samegold evidence --profile ci --claims SG-07 --repetitions 10
      - name: render the documents
        run: samegold readme && samegold check
      - name: every published figure recomputes from the seeds its own record names
        # THE GATE THAT HAS TO BITE BEFORE THE PUSH, and the reason it is here rather than on
        # the pull request this job opens. Measured 22 September 2026: the one check ever
        # queued on an evidence pull request was run 35587784478, which ended `action_required`
        # and never executed. A check on a pull request opened by GITHUB_TOKEN waits for a
        # human click, so a required check there is a gate that cannot report.
        #
        # Here it can. The records were written by the steps above, on this runner, and this
        # re-runs each claim from the seeds its own record names before anything is pushed.
        # ADR 0011 said this step was here before it was; it is here now.
        run: samegold verify-latest
      - name: attest the evidence
        # Provenance, so a reader can tell a number produced by this workflow from a number
        # produced by someone with a text editor.
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: evidence/history.jsonl
      - name: commit
        # The job pushes to its own branch and opens a pull request rather than pushing to the
        # default branch. The comment here used to justify that by branch protection; `main` in
        # this repository is NOT protected (`gh api repos/.../branches/main/protection` answers
        # 404), so that was a reason this job does not have. The reason it does have is that a
        # record is evidence: it should arrive where someone looks at it before it becomes the
        # number on the front page.
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          branch="evidence/run-${{ github.run_id }}"
          git checkout -b "$branch"
          # Every file `samegold readme` writes, taken from the CLI rather than listed by
          # hand: the job used to render docs/postmortem-2026-03-06.md and then commit
          # everything except it, so the pull request it opened was red by construction.
          git add evidence $(python -c "from samegold.cli import RENDERED_FILES; print(' '.join(RENDERED_FILES))")
          if git diff --staged --quiet; then
            echo "no change in the evidence; nothing to push"
            exit 0
          fi
          git commit -m "evidence: run ${{ github.run_id }}"
          git push --set-upstream origin "$branch"
          # NOT `|| true`. Opening the pull request can fail for one reason that is a setting
          # rather than an error - "Allow GitHub Actions to create and approve pull requests",
          # off by default on a new repository - and the branch is pushed either way, so the
          # evidence is never lost. What must not happen is the job reporting success while
          # nobody is told the branch exists: the failure names the setting and the command.
          if ! gh pr create --fill --base "${{ github.ref_name }}"; then
            echo "::error::the evidence is pushed to $branch and the pull request was NOT"
            echo "::error::opened. If this says 'GitHub Actions is not permitted to create or"
            echo "::error::approve pull requests', turn on Settings -> Actions -> General ->"
            echo "::error::Workflow permissions -> 'Allow GitHub Actions to create and approve"
            echo "::error::pull requests'. Until then, open it by hand:"
            echo "::error::  gh pr create --base ${{ github.ref_name }} --head $branch --fill"
            exit 1
          fi
          # AND IT CLOSES IT, immediately, rather than with `--auto`.
          #
          # `--auto` was the first design and it cannot work here. Measured on 22 September
          # 2026 by asking GitHub rather than by reading its documentation:
          #
          #   gh api graphql -f query='{repository(owner:"marcosmatalab",name:"samegold"){
          #     autoMergeAllowed pullRequests(states:OPEN,first:5){nodes{
          #     number viewerCanEnableAutoMerge mergeable}}}}'
          #
          #   autoMergeAllowed        false
          #   viewerCanEnableAutoMerge  false on all three open pull requests,
          #                             including the one reported MERGEABLE
          #
          # Two reasons, and the second survives fixing the first: the repository setting is
          # off, and auto-merge is a queue for a pull request that is WAITING for something.
          # `main` has no protection (`gh api .../branches/main/protection` answers 404) and
          # no rulesets (`gh api .../rulesets` answers `[]`), so nothing is ever pending and
          # there is nothing for a queue to wait on. A pull request opened and left open by a
          # job that could have merged it is not review, it is a branch: the cron opened four
          # and exactly one was ever closed, while the front page named a commit eighteen
          # behind HEAD.
          #
          # What justifies merging without a human is the step above, which recomputed every
          # published figure from the seeds its own record names, on this runner, before this
          # line could run. See docs/adr/0014-the-evidence-pull-request-merges-itself.md for
          # the alternative that was rejected and why.
          # Retried, because GitHub computes mergeability asynchronously: a pull request opened
          # a second ago reports `MERGEABLE: UNKNOWN` and the merge is refused for a reason
          # that is gone by the time anybody reads the log. Six tries over a minute, and then
          # the warning - a race that leaves the branch open is the exact failure this step
          # exists to end.
          merged=""
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge --squash --delete-branch; then
              merged="yes"
              break
            fi
            echo "merge attempt $attempt did not take; GitHub may still be computing"
            sleep 10
          done
          if [ -z "$merged" ]; then
            echo "::warning::the evidence is on $branch and its pull request is open; six"
            echo "::warning::merge attempts over a minute were refused. Close it by hand:"
            echo "::warning::  gh pr merge --squash --delete-branch $branch"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
