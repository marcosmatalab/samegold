name: evidence

# The only job allowed to write evidence that backs a published number. A record produced
# anywhere else carries no ci_run_url and the renderer prints it as "local run, not reproduced
# in CI", which is the honest label for a number produced on the author's laptop.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      SAMEGOLD_STORAGE: parquet
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[spark,rust,dev]"
      - name: claims
        run: samegold evidence --profile ci
      - name: crash campaign and the claims that need a JVM
        run: samegold evidence --profile ci --claims SG-07
      - name: render the documents
        run: samegold readme && samegold check
      - name: attest the evidence
        # Provenance, so a reader can tell a number produced by this workflow from a number
        # produced by someone with a text editor.
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: evidence/history.jsonl
      - name: commit
        # Pushing to a protected branch with the default GITHUB_TOKEN fails, and it fails at
        # the END of an hour of compute. So the job pushes to its own branch and opens a pull
        # request instead: the evidence still lands, and a protected main stays protected.
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          branch="evidence/run-${{ github.run_id }}"
          git checkout -b "$branch"
          git add evidence README.md CLAIMS.md
          if git diff --staged --quiet; then
            echo "no change in the evidence; nothing to push"
            exit 0
          fi
          git commit -m "evidence: run ${{ github.run_id }}"
          git push --set-upstream origin "$branch"
          gh pr create --fill --base "${{ github.ref_name }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
