name: evidence

# The only job allowed to write evidence that backs a published number. A record produced
# anywhere else carries no ci_run_url and the renderer prints it as "local run, not reproduced
# in CI", which is the honest label for a number produced on the author's laptop.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write
  id-token: write
  attestations: write
  # `gh pr create` needs this and did not have it. The step that opens the pull request ended
  # in `|| true`, so the job would have finished GREEN having pushed a branch and opened
  # nothing - an hour of compute reporting success for work it had not done, which is the
  # shape this repository keeps finding in itself.
  pull-requests: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      SAMEGOLD_STORAGE: parquet
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[spark,rust,dev]"
      - name: claims
        run: samegold evidence --profile ci
      - name: crash campaign and the claims that need a JVM
        run: samegold evidence --profile ci --claims SG-07
      - name: render the documents
        run: samegold readme && samegold check
      - name: attest the evidence
        # Provenance, so a reader can tell a number produced by this workflow from a number
        # produced by someone with a text editor.
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: evidence/history.jsonl
      - name: commit
        # The job pushes to its own branch and opens a pull request rather than pushing to the
        # default branch. The comment here used to justify that by branch protection; `main` in
        # this repository is NOT protected (`gh api repos/.../branches/main/protection` answers
        # 404), so that was a reason this job does not have. The reason it does have is that a
        # record is evidence: it should arrive where someone looks at it before it becomes the
        # number on the front page.
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          branch="evidence/run-${{ github.run_id }}"
          git checkout -b "$branch"
          # Every file `samegold readme` writes, taken from the CLI rather than listed by
          # hand: the job used to render docs/postmortem-2026-03-06.md and then commit
          # everything except it, so the pull request it opened was red by construction.
          git add evidence $(python -c "from samegold.cli import RENDERED_FILES; print(' '.join(RENDERED_FILES))")
          if git diff --staged --quiet; then
            echo "no change in the evidence; nothing to push"
            exit 0
          fi
          git commit -m "evidence: run ${{ github.run_id }}"
          git push --set-upstream origin "$branch"
          # NOT `|| true`. Opening the pull request can fail for one reason that is a setting
          # rather than an error - "Allow GitHub Actions to create and approve pull requests",
          # off by default on a new repository - and the branch is pushed either way, so the
          # evidence is never lost. What must not happen is the job reporting success while
          # nobody is told the branch exists: the failure names the setting and the command.
          if ! gh pr create --fill --base "${{ github.ref_name }}"; then
            echo "::error::the evidence is pushed to $branch and the pull request was NOT"
            echo "::error::opened. If this says 'GitHub Actions is not permitted to create or"
            echo "::error::approve pull requests', turn on Settings -> Actions -> General ->"
            echo "::error::Workflow permissions -> 'Allow GitHub Actions to create and approve"
            echo "::error::pull requests'. Until then, open it by hand:"
            echo "::error::  gh pr create --base ${{ github.ref_name }} --head $branch --fill"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
