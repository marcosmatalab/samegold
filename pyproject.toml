[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "samegold"
version = "0.1.0"
description = "The month-end close that survives late returns, mid-write crashes and reprocessing - and proves it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Marcos Mata Garcia" }]
dependencies = [
  "duckdb>=1.5,<2",
  "pyarrow>=21",
  "sqlglot>=27",
  # delta-rs is a CORE dependency, not an extra: the governance purge and the cost lab are
  # part of the fast lane and both read and write real Delta tables with it. It is a wheel
  # with no JVM behind it, which is what makes that possible.
  "deltalake>=1.6,<2",
]

[project.optional-dependencies]
# The Spark lane. Pinned hard: this is the only combination verified to work (see docs/adr/0002).
spark = [
  "pyspark==4.2.0",
  "delta-spark==4.4.0",
  "pandas>=2.2,<3.0",
  "pyyaml>=6",
  "grpcio>=1.67",
  "grpcio-status>=1.67",
  "googleapis-common-protos>=1.65",
  "zstandard>=0.25",
]
# Kept as an extra name so older instructions still work; delta-rs is a core dependency now.
rust = ["deltalake>=1.6,<2"]
dev = [
  "pytest>=8",
  "pytest-xdist>=3",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  # the fast lane parses the declarative pipeline spec to check it against the code
  "pyyaml>=6",
]

[project.scripts]
samegold = "samegold.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/samegold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "spark: needs a local JVM + pyspark (slow, ~25s session startup)",
  "delta: needs Maven Central reachable to resolve the Delta jars",
  "databricks: needs DATABRICKS_HOST/DATABRICKS_TOKEN against a Free Edition workspace",
  "evidence_dependent: compares the documents with evidence/, so SG-00 deselects it while writing that evidence",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks run with `spark`, `dbutils` and `display` injected by the runtime.
# Declaring them would be a lie about how the file executes there.
"databricks/src/*.py" = ["F821"]
"pipelines/transformations/*.py" = ["F821"]

[tool.mypy]
python_version = "3.11"
strict = true
# The two directories after the package are the ones nothing checked for ten rounds. They
# hold the declarative-pipeline and notebook sources, which are loaded by path rather than
# imported, and a directory a repository does not check is a directory that rots - the thesis
# of this repository applied to itself. See
# docs/adr/0006-mutants-are-generated-not-planted.md, which is where the same shape of
# mistake is logged: a check whose scope is narrower than the thing it appears to report on.
files = ["src/samegold", "databricks/src", "pipelines/transformations"]
# `typings/` shadows numpy with an empty stub. numpy is nobody's import here - it arrives
# behind duckdb and pandas - and its 2.x stubs use 3.12 syntax that mypy refuses to parse
# under the 3.11 this project targets. Without the shadow, `mypy` cannot start once the spark
# extras are installed, which is the state a contributor working on the Delta lane is in.
# typings/numpy/__init__.pyi explains the trade.
mypy_path = "typings"
[[tool.mypy.overrides]]
module = [
  "duckdb.*", "pyspark.*", "delta.*", "deltalake.*", "sqlglot.*", "pyarrow.*", "arro3.*",
  # numpy submodules, which the shadow stub package in typings/ does not define. See
  # typings/numpy/__init__.pyi for why numpy is shadowed at all.
  "numpy.*",
]
ignore_missing_imports = true

# PySpark ships no usable stubs, so every DataFrame is Any and "returning Any from a function
# declared to return DataFrame" fires on every single transformation. Turning the warning off
# for the Spark-facing packages is honest; turning strict mode off for the whole project to
# silence it would not be.
#
# `@dp.table` is an untyped decorator for the same reason, and under strict mode an untyped
# decorator makes the function it wraps untyped, so every declarative table would need the
# warning suppressed at its own definition. The files outside the package are named by
# basename here, which is how mypy names a module it loads by path.
[[tool.mypy.overrides]]
module = [
  "samegold.pipelines.*",
  "samegold.ingest.*",
  "samegold.faults.*",
  "samegold.cost.*",
  "bronze_autoloader",
  "bronze_silver",
  "close_month",
  "gold_close",
  "publish_evidence",
  "silver_expectations",
]
warn_return_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
# These files type-check DIFFERENTLY depending on whether pyspark is installed: without it
# `dp` and `spark` are Any and nothing is checked; with it, the real signatures apply and the
# Databricks-only calls below are errors against the open-source API. The suppressions those
# need are therefore unused in the first case, so an unused one is not a finding here.
warn_unused_ignores = false
